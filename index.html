<script>
/* ============================================================
 * 1. Mini Markdown Parser（无外部依赖）
 * ============================================================ */
function escapeHtml(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function inline(s){
  s = escapeHtml(s);
  s = s.replace(/!\[([^\]]*)\]\(([^)\s]+)(?:\s+"[^"]*")?\)/g,'<img src="$2" alt="$1">');
  s = s.replace(/\[([^\]]+)\]\(([^)\s]+)(?:\s+"[^"]*")?\)/g,'<a href="$2" target="_blank">$1</a>');
  /* 裸网址自动转链接：排除属性值(引号/等号/>前)与中文句读，保留 & 参数，修剪尾部英文标点与不平衡括号 */
  s = s.replace(/(?<!["'=>])(https?:\/\/[^\s<>"'，。；！？、）】」』]{4,})/g, match=>{
    let url = match, tail = '';
    while (/[).,;:!?]$/.test(url)) {
      const ch = url.slice(-1);
      if (ch === ')') {
        const open = (url.match(/\(/g)||[]).length;
        const close = (url.match(/\)/g)||[]).length;
        if (close <= open) break;
      }
      tail = ch + tail;
      url = url.slice(0, -1);
    }
    return '<a href="'+url+'" target="_blank">'+url+'</a>'+tail;
  });
  s = s.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
  s = s.replace(/(^|[^*])\*([^*\n]+)\*/g,'$1<em>$2</em>');
  s = s.replace(/`([^`]+)`/g,'<code>$1</code>');
  s = s.replace(/~~([^~]+)~~/g,'<del>$1</del>');
  return s;
}

function buildTable(rows){
  const parseRow = r => r.replace(/^\|/,'').replace(/\|$/,'').split('|').map(c=>c.trim());
  const head = parseRow(rows[0]);
  let body = rows.slice(1);
  if(body.length && /^[\s:|-]+$/.test(body[0].replace(/\|/g,''))) body = body.slice(1);
  let h = '<table><thead><tr>' + head.map(c=>'<th>'+inline(c)+'</th>').join('') + '</tr></thead><tbody>';
  body.forEach(r=>{ h += '<tr>' + parseRow(r).map(c=>'<td>'+inline(c)+'</td>').join('') + '</tr>'; });
  return h + '</tbody></table>';
}

function parseMD(src){
  const lines = src.replace(/\r\n?/g,'\n').split('\n');
  let html = '', inCode = false, codeBuf = [];
  let para = [], quote = [], table = [], listType = null;

  const flushPara  = ()=>{ if(para.length){ html += '<p>'+inline(para.join(' '))+'</p>'; para = []; } };
  const flushQuote = ()=>{ if(quote.length){ html += '<blockquote>'+quote.map(l=>'<p>'+inline(l)+'</p>').join('')+'</blockquote>'; quote = []; } };
  const flushTable = ()=>{ if(table.length){ html += buildTable(table); table = []; } };
  const flushList  = ()=>{ if(listType){ html += '</'+listType+'>'; listType = null; } };
  const flushAll   = ()=>{ flushPara(); flushQuote(); flushTable(); flushList(); };

  for(const line of lines){
    if(/^\s*```/.test(line)){
      if(!inCode){ flushAll(); inCode = true; codeBuf = []; }
      else { html += '<pre><code>'+escapeHtml(codeBuf.join('\n'))+'</code></pre>'; inCode = false; }
      continue;
    }
    if(inCode){ codeBuf.push(line); continue; }
    if(/^\s*$/.test(line)){ flushAll(); continue; }

    let m = line.match(/^(#{1,4})\s+(.*)$/);
    if(m){ flushAll(); const lv = m[1].length; html += '<h'+lv+'>'+inline(m[2].trim())+'</h'+lv+'>'; continue; }

    if(/^\s*(-{3,}|\*{3,}|_{3,})\s*$/.test(line)){ flushAll(); html += '<hr>'; continue; }

    m = line.match(/^>\s?(.*)$/);
    if(m){ flushPara(); flushTable(); flushList(); quote.push(m[1]); continue; }
    flushQuote();

    if(/^\s*\|.*\|\s*$/.test(line)){ flushPara(); flushList(); table.push(line.trim()); continue; }
    flushTable();

    m = line.match(/^\s*[-*+]\s+(.*)$/);
    if(m){ flushPara(); if(listType!=='ul'){ flushList(); html+='<ul>'; listType='ul'; } html += '<li>'+inline(m[1])+'</li>'; continue; }
    m = line.match(/^\s*\d{1,2}[.)]\s+(.*)$/);
    if(m){ flushPara(); if(listType!=='ol'){ flushList(); html+='<ol>'; listType='ol'; } html += '<li>'+inline(m[1])+'</li>'; continue; }
    flushList();

    m = line.match(/^!\[([^\]]*)\]\(([^)\s]+)\)\s*$/);
    if(m){ flushAll(); html += '<section data-fig="1"><img src="'+m[2]+'" alt="'+escapeHtml(m[1])+'"><p data-cap="1">'+escapeHtml(m[1])+'</p></section>'; continue; }

    para.push(line);
  }
  if(inCode) html += '<pre><code>'+escapeHtml(codeBuf.join('\n'))+'</code></pre>';
  flushAll();
  return html;
}

/* ============================================================
 * 2. 章节编号拆分（一、二、三… → 各主题格式）
 * ============================================================ */
const CN_NUMS = {'一':1,'二':2,'三':3,'四':4,'五':5,'六':6,'七':7,'八':8,'九':9,'十':10};
function splitChapter(t){
  const m = t.match(/^([一二三四五六七八九十]{1,2})[、.．]\s*(.+)$/);
  if(!m) return { cn:'', ar:'', text:t };
  return { cn:m[1], ar:(CN_NUMS[m[1]]||'')+'', text:m[2] };
}
function splitTitle(t){
  const idx = t.search(/——|--/);
  if(idx > 0){
    const parts = t.split(/——|--/);
    return { main:parts[0].trim(), sub:parts.slice(1).join('——').trim() };
  }
  return { main:t, sub:'' };
}

/* ============================================================

const editor = document.getElementById('editor');
const preview = document.getElementById('preview-article');
const previewScroll = document.getElementById('preview-scroll');
const themeBar = document.getElementById('theme-bar');
const themeNameEl = document.getElementById('theme-name');
const wordCountEl = document.getElementById('word-count');
const optSignature = document.getElementById('opt-signature');
const optSeries = document.getElementById('opt-series');

let currentTheme = localStorage.getItem('nzmd_theme') || 'handdrawn';

function applyTheme(root, t){
  root.setAttribute('style', t.page);

  root.querySelectorAll('section[data-fig]').forEach(f=>{
    f.setAttribute('style', t.styles.figure);
    f.querySelectorAll('img').forEach(im=>im.setAttribute('style', t.styles.img));
    const cap = f.querySelector('[data-cap]');
    if(cap){ cap.setAttribute('style', t.styles.figcaption); cap.removeAttribute('data-cap'); }
    f.removeAttribute('data-fig');
  });

  root.querySelectorAll('h1').forEach((h,i)=>{ h.outerHTML = (i===0) ? t.title(h.textContent) : t.h2(h.textContent); });
  root.querySelectorAll('h2').forEach(h=>{ h.outerHTML = t.h2(h.textContent); });
  root.querySelectorAll('h3, h4').forEach(h=>{ h.outerHTML = t.h3(h.textContent); });

  let bqIdx = 0;
  root.querySelectorAll('blockquote').forEach(b=>{
    const isIntro = (bqIdx === 0 && optSeries.checked);
    const fs = b.querySelector('strong');
    const startsBold = fs && b.textContent.trim().startsWith(fs.textContent.trim());
    let st = t.styles.blockquote, pst = t.styles.bqP, label = null, labelStyle = null;
    if(isIntro){
      st = t.styles.blockquoteIntro;
      if(t.bqIntroLabel){ label = t.bqIntroLabel; labelStyle = (t === THEMES.launch) ? "margin:0 0 10px;font-size:12px;color:rgba(255,255,255,.85);letter-spacing:3px;text-align:center;font-weight:600;" : "margin:0 0 8px;font-size:12px;letter-spacing:2px;color:inherit;opacity:.75;font-family:Georgia,serif;text-align:center;"; }
    } else if(startsBold && t.styles.blockquoteKey){
      st = t.styles.blockquoteKey;
      if(t.styles.blockquoteKeyP) pst = t.styles.blockquoteKeyP;
      if(t.bqKeyLabel){
        label = t.bqKeyLabel;
        labelStyle = (t === THEMES.launch)
          ? "margin:0 0 10px;font-size:13px;color:rgba(255,255,255,.95);letter-spacing:3px;text-align:center;font-weight:700;"
          : (t.bqKeyLabel === '"')
              ? "font-size:40px;color:#c0392b;margin:0;line-height:.5;font-family:Georgia,serif;text-align:center;"
              : "margin:0 0 8px;font-size:12px;letter-spacing:2px;color:#c9a05a;text-align:center;font-family:Georgia,serif;";
      }
    } else if(t.bqLabel){
      label = t.bqLabel;
      labelStyle = "margin:0 0 8px;font-size:12px;letter-spacing:2px;color:#8a8a8a;font-family:Georgia,serif;";
      if(t === THEMES.geek) labelStyle = "margin:0 0 6px;font-size:12px;color:#636c76;font-family:'Cascadia Code',Consolas,monospace;";
      if(t === THEMES.editorial) labelStyle = "margin:0 0 8px;font-size:11px;color:#6b6b6b;letter-spacing:3px;font-family:Georgia,serif;";
      if(t === THEMES.storybook) labelStyle = "margin:0 0 6px;font-size:13px;color:#c9a05a;text-align:center;font-family:Georgia,serif;";
    }
    b.setAttribute('style', st);
    if(label) b.insertAdjacentHTML('afterbegin', '<p style="'+labelStyle+'">'+label+'</p>');
    b.querySelectorAll('p').forEach((p,pi)=>{
      if(label && pi === 0) return;
      let actualPst = pst;
      /* launch 主题特判：intro 是深蓝块 → p 白色；key 是黑底块 → p 黄色 */
      if(t === THEMES.launch && st === t.styles.blockquoteIntro){
        actualPst = "margin:0 0 10px;font-size:15px;color:#FFFFFF;line-height:1.9;letter-spacing:.3px;";
      } else if(t === THEMES.launch && st === t.styles.blockquoteKey){
        actualPst = "margin:0 0 10px;font-size:16px;color:#F4E94B;line-height:1.9;font-weight:700;letter-spacing:.3px;";
      }
      p.setAttribute('style', actualPst);
    });
    bqIdx++;
  });

  root.querySelectorAll('p').forEach(p=>{ if(!p.closest('blockquote')) p.setAttribute('style', t.styles.p); });
  root.querySelectorAll('strong').forEach(s=>s.setAttribute('style', t.styles.strong));
  root.querySelectorAll('em').forEach(s=>s.setAttribute('style', t.styles.em));
  root.querySelectorAll('a').forEach(s=>s.setAttribute('style', t.styles.a));
  root.querySelectorAll('code').forEach(s=>{ if(!s.closest('pre')) s.setAttribute('style', t.styles.code); });
  root.querySelectorAll('ul').forEach(s=>s.setAttribute('style', t.styles.ul));
  root.querySelectorAll('ol').forEach(s=>s.setAttribute('style', t.styles.ol));
  root.querySelectorAll('li').forEach(s=>s.setAttribute('style', t.styles.li));

  root.querySelectorAll('table').forEach(tb=>{
    tb.setAttribute('style', t.styles.table);
    tb.querySelectorAll('th').forEach(c=>c.setAttribute('style', t.styles.th));
    tb.querySelectorAll('td').forEach(c=>c.setAttribute('style', t.styles.td));
    const wrap = document.createElement('section');
    wrap.setAttribute('style', 'margin:24px 0;overflow-x:auto;');
    tb.parentNode.insertBefore(wrap, tb);
    wrap.appendChild(tb);
  });

  root.querySelectorAll('pre').forEach(pre=>{
    const code = pre.querySelector('code');
    pre.outerHTML = t.pre(code ? code.innerHTML : pre.innerHTML);
  });

  root.querySelectorAll('hr').forEach(h=>{ h.outerHTML = t.hr(); });

  if(t.dropCap){
    const firstP = root.querySelector('p');
    if(firstP && !firstP.closest('blockquote')){
      const txt = firstP.innerHTML;
      const ch = txt.charAt(0);
      if(/[\u4e00-\u9fa5A-Za-z]/.test(ch)){
        firstP.innerHTML = '<span style="'+t.dropCap.style+'">'+ch+'</span>' + txt.slice(1);
      }
    }
  }

  if(optSignature.checked && root.textContent.trim()) root.insertAdjacentHTML('beforeend', t.signature());
}

/* 代码块右上角加"复制代码"按钮（仅预览交互层，复制正文时剔除） */
function addCodeCopyButtons(){
  preview.querySelectorAll('pre').forEach(pre=>{
    const host = pre.parentElement;
    if(!host || host.querySelector(':scope > .code-copy-btn')) return;
    host.style.position = 'relative';
    const btn = document.createElement('button');
    btn.className = 'code-copy-btn';
    btn.textContent = '复制代码';
    btn.addEventListener('click', e=>{
      e.stopPropagation();
      copyText(pre.textContent);
      btn.textContent = '已复制 ✓';
      setTimeout(()=>{ btn.textContent = '复制代码'; }, 1500);
    });
    host.appendChild(btn);
  });
}

function copyText(text){
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.left = '-9999px';
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand('copy'); } catch(e){}
  ta.remove();
}

function render(){
  const t = THEMES[currentTheme];
  const md = editor.value;
  /* 空内容：只显示主题底色+提示，不追加签名 */
  if(!md.trim()){
    preview.setAttribute('style', t.page);
    preview.innerHTML = '<p style="margin:80px 0;text-align:center;font-size:14px;color:#b6b6b6;letter-spacing:1px;">在左侧输入 Markdown，这里实时显示排版效果</p>';
    previewScroll.style.background = t.previewBg;
    themeNameEl.textContent = t.name;
    wordCountEl.textContent = '0 字';
    document.querySelectorAll('.theme-pill').forEach(p=>{
      p.classList.toggle('active', p.dataset.id === currentTheme);
    });
    localStorage.setItem('nzmd_content', md);
    localStorage.setItem('nzmd_theme', currentTheme);
    return;
  }
  preview.innerHTML = parseMD(md);
  applyTheme(preview, t);
  addCodeCopyButtons();
  previewScroll.style.background = t.previewBg;
  themeNameEl.textContent = t.name;
  const plain = md.replace(/[#>*`|\-\[\]()!]/g,'').replace(/\s/g,'');
  wordCountEl.textContent = plain.length + ' 字';
  document.querySelectorAll('.theme-pill').forEach(p=>{
    p.classList.toggle('active', p.dataset.id === currentTheme);
  });
  localStorage.setItem('nzmd_content', md);
  localStorage.setItem('nzmd_theme', currentTheme);
}

/* ============================================================
 * 5. UI 初始化
 * ============================================================ */
Object.keys(THEMES).forEach(id=>{
  const t = THEMES[id];
  const pill = document.createElement('span');
  pill.className = 'theme-pill';
  pill.dataset.id = id;
  pill.innerHTML = '<span class="dot" style="background:'+t.dot+'"></span>' + t.name;
  pill.onclick = ()=>{ currentTheme = id; render(); };
  themeBar.appendChild(pill);
});

let renderTimer = null;
editor.addEventListener('input', ()=>{
  clearTimeout(renderTimer);
  renderTimer = setTimeout(render, 200);
});
editor.addEventListener('keydown', e=>{
  if(e.key === 'Tab'){ e.preventDefault();
    const s = editor.selectionStart;
    editor.setRangeText('  ', s, editor.selectionEnd, 'end');
  }
});
optSignature.addEventListener('change', render);
optSeries.addEventListener('change', render);

document.getElementById('btn-copy').onclick = ()=>{
  /* 克隆预览节点：剔除"复制代码"交互按钮，只复制干净正文 */
  const clone = preview.cloneNode(true);
  clone.querySelectorAll('.code-copy-btn').forEach(b=>b.remove());
  clone.removeAttribute('id');
  clone.style.position = 'fixed';
  clone.style.left = '-99999px';
  clone.style.top = '0';
  clone.style.width = preview.offsetWidth + 'px';
  document.body.appendChild(clone);
  const range = document.createRange();
  range.selectNode(clone);
  const sel = window.getSelection();
  sel.removeAllRanges();
  sel.addRange(range);
  let ok = false;
  try { ok = document.execCommand('copy'); } catch(e){}
  sel.removeAllRanges();
  clone.remove();
  toast(ok ? '已复制！去公众号编辑器 Ctrl+V 粘贴' : '复制失败，请手动全选预览区复制');
};
document.getElementById('btn-clear').onclick = ()=>{ editor.value=''; render(); };
document.getElementById('btn-sample').onclick = ()=>{ editor.value = SAMPLE; render(); };

function toast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(()=>el.classList.remove('show'), 2400);
}

const SAMPLE = `# 不只是"聊天机器人"——AI Agent 到底是什么？

> 本文是「AI 基础设施科普」系列第 5 篇。上一篇我们聊了上下文窗口，知道了 AI 为什么会"变笨"。今天聊 AI 怎么从"只会说话"变成"会自己干活"。

你可能用过 ChatGPT 聊天，也听过"AI Agent"这个词。它们最大的区别可以用一句话说清：

**Chatbot 只能"说话"，Agent 能"做事"。**

## 一、Chatbot 和 Agent 有什么区别？

> 你去餐厅，Chatbot 像一个只会念菜单的服务员——你问什么它答什么，但不会帮你下单、上菜、结账。
>
> Agent 像一个真正的餐厅经理——你告诉他"我要办一场十人聚餐"，他自己安排菜单、下单、排座位、催菜。

| 维度 | Chatbot | Agent |
|:-:|:-:|:-:|
| 交互方式 | 你说一句，它回一句 | 你给目标，它拆步骤执行 |
| 工具使用 | 不能调用外部工具 | 可以读写文件、搜索网络 |
| 任务复杂度 | 单轮问答 | 多步任务、循环执行 |

1. **感知**：收到用户需求"查一下茅台股价"
